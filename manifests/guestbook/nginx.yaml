apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-guestbook
  namespace: default
  labels:
    app: nginx-guestbook
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx-guestbook
  template:
    metadata:
      labels:
        app: nginx-guestbook
    spec:
      containers:
      - name: nginx
        image: nginx:stable-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-guestbook-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: nginx-guestbook
